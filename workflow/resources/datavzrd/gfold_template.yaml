__use_yte__: true

name: |
  ?f"Conservative fold change estimates for the contrast {wildcards.contrast}."

datasets:
  gfold_table:
    path: ?input.gfold_table
    separator: "\t"

default-view: gfold_table

views:
  gfold_table:
    dataset: gfold_table
    desc: |
      ?f"""
      Conservative fold change estimates for the contrast {wildcards.contrast}.

      gfold_0_01 is the GFOLD value at the significance cutoff 0.01. This can be interpreted as a probability of 0.99 that the log2 fold change is greater than the reported GFOLD value (in absolute terms). Only (absolute) GFOLD values above the threshold of {params.gfold_0_01_cutoff} are reported."
      """
    page-size: 25
    render-table:
      columns:
        transcript_id:
          display-mode: normal
          link-to-url: 
            Ensembl:
              url: "https://www.ensembl.org/Homo_sapiens/Transcript/Summary?t={transcript_id}"
        gene_id:
          display-mode: normal
          link-to-url: 
            Ensembl:
              url: "https://www.ensembl.org/Homo_sapiens/Gene/Summary?g={gene_id}"
        gene_symbol:
          display-mode: normal
          link-to-url: 
            GeneCards:
              url: "https://www.genecards.org/cgi-bin/carddisp.pl?gene={gene_symbol}"
        gfold_0_01:
          plot:
            heatmap:
              scale: linear
              range:
                - "#B2182B"
                - "#F7F7F7"
                - "#2166AC"
              domain-mid: 0
        e_fdr:
          display-mode: detail
          plot:
            ticks:
              scale: linear
        log2fdc:
          display-mode: detail
          plot:
            heatmap:
              scale: linear
              range:
                - "#B2182B"
                - "#F7F7F7"
                - "#2166AC"
              domain-mid: 0
        rpkm_baseline:
          plot:
            ticks:
              scale: linear
        rpkm_changed:
          plot:
            ticks:
              scale: linear